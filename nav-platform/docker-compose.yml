services:
  web:
    build: { context: ., dockerfile: Dockerfile }
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://nas:${PG_PASSWORD}@postgres:5432/nas_platform
      - AUTH_SECRET=${AUTH_SECRET}
      # 自部署必填，否则 Auth.js 报 UntrustedHost
      - AUTH_TRUST_HOST=true
      - CRON_SECRET=${CRON_SECRET}
      - NAS_PHOTO_ROOT=/data/photos
      - TZ=Asia/Shanghai
      # 通知渠道（企微应用消息 / 邮件）
      - WECOM_CORP_ID=${WECOM_CORP_ID:-}
      - WECOM_CORP_SECRET=${WECOM_CORP_SECRET:-}
      - WECOM_AGENT_ID=${WECOM_AGENT_ID:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-}
    volumes:
      - /vol1/1000/photos:/data/photos:ro   # 飞牛照片目录，只读挂载
    ports:
      - "3210:3000"
    depends_on:
      postgres: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }

  worker:
    build: { context: ., dockerfile: Dockerfile.worker }
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://nas:${PG_PASSWORD}@postgres:5432/nas_platform
      - TZ=Asia/Shanghai
      # 定时任务要发通知，配置与 web 一致
      - WECOM_CORP_ID=${WECOM_CORP_ID:-}
      - WECOM_CORP_SECRET=${WECOM_CORP_SECRET:-}
      - WECOM_AGENT_ID=${WECOM_AGENT_ID:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-}
    depends_on:
      postgres: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }

  # 启动前自动执行迁移与种子（只跑一次，幂等）
  migrator:
    build: { context: ., dockerfile: Dockerfile, target: migrator }
    profiles: ["migrate"]
    environment:
      - DATABASE_URL=postgresql://nas:${PG_PASSWORD}@postgres:5432/nas_platform
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - TZ=Asia/Shanghai
    depends_on:
      postgres: { condition: service_healthy }
    command: sh -c "npx prisma migrate deploy && npm run db:seed"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=nas_platform
      - POSTGRES_USER=nas
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - TZ=Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nas -d nas_platform"]
      interval: 10s
      retries: 5

  # 外网访问（可选）：取消注释并在 .env 填 TS_AUTHKEY。
  # 注意：不要把 3210 端口映射到公网。
  # tailscale:
  #   image: tailscale/tailscale:latest
  #   restart: unless-stopped
  #   environment:
  #     - TS_AUTHKEY=${TS_AUTHKEY}
  #     - TS_STATE_DIR=/var/lib/tailscale
  #   volumes:
  #     - tsstate:/var/lib/tailscale
  #   cap_add: [NET_ADMIN, SYS_MODULE]

volumes:
  pgdata:
  # tsstate:
